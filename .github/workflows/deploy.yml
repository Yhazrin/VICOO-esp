name: VICOO CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vicoo
  DOCKER_USERNAME: ${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Backend ====================
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install mypy ruff
      - name: Ruff检查
        run: ruff check app/ --ignore=E402,E701,E741,F841
      - name: Mypy类型检查
        run: mypy app/ --ignore-missing-imports

  backend-test:
    name: Backend - 单元测试
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: vicoo_test
          MYSQL_USER: vicoo
          MYSQL_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt pytest pytest-asyncio httpx aiomysql
      - name: 运行测试
        env:
          DATABASE_URL: mysql+aiomysql://vicoo:${{ secrets.TEST_DB_PASSWORD }}@localhost:3306/vicoo_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CHILD_DATA_ENCRYPTION_KEY: ${{ secrets.CHILD_DATA_ENCRYPTION_KEY }}
          APP_SECRET_KEY: test-secret-key-for-ci
        run: pytest tests/ -v --tb=short --ignore=tests/security-tests

  backend-build:
    name: Backend - Docker镜像构建
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置Docker元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 登录到GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送Backend镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/easy/backend.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Frontend ====================
  frontend-lint:
    name: Frontend - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/web-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: TypeScript检查
        run: npx tsc --noEmit
      - name: ESLint检查
        run: npm run lint || true

  frontend-test:
    name: Frontend - 单元测试
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/web-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        run: npm test -- --passWithNoTests --watchAll=false

  frontend-build:
    name: Frontend - 构建Docker镜像
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置Docker元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 登录到GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建Frontend
        run: |
          npm ci
          npm run build
      - name: 复制Nginx配置
        run: cp deploy/easy/nginx.conf frontend/web-react/nginx.conf
      - name: 构建并推送Frontend镜像
        uses: docker/build-push-action@v5
        with:
          context: frontend/web-react
          file: ../../deploy/easy/frontend.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Admin Dashboard ====================
  admin-build:
    name: Admin - 构建Docker镜像
    runs-on: ubuntu-latest
    needs: []
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置Docker元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/admin
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 登录到GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建Admin
        run: |
          cd admin && npm ci && npm run build
      - name: 构建并推送Admin镜像
        uses: docker/build-push-action@v5
        with:
          context: admin
          file: ../deploy/easy/admin.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到Staging ====================
  deploy-staging:
    name: 部署到Staging环境
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, admin-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.vicoo.example.com
    steps:
      - uses: actions/checkout@v4

      - name: 配置SSH客户端
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: 添加跳板机SSH密钥
        env:
          JUMP_HOST: ${{ secrets.JUMP_HOST }}
          JUMP_PORT: ${{ secrets.JUMP_PORT }}
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat << 'EOF' > ~/.ssh/config
          Host jump
              HostName ipa-rdp.ucd.ie
              User CS23219620
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host vm
              HostName csi420-02-vm8.ucd.ie
              User student
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyJump jump
          EOF
          chmod 600 ~/.ssh/config

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 检查远程服务器状态
        run: ssh vm "echo 'SSH连接成功' && hostname && uptime"

      - name: 配置Git身份
        run: |
          ssh vm "git config --global user.name 'GitHub Actions' && git config --global user.email 'github-actions@vicoo'"

      - name: 初始化或更新代码仓库
        run: |
          ssh vm "
            if [ ! -d /home/student/vicoo/.git ]; then
              git clone https://github.com/{{ github.repository }}.git /home/student/vicoo
            fi
          "

      - name: 拉取最新代码并部署
        run: |
          ssh vm "cd /home/student/vicoo && git fetch origin && git checkout main && git pull origin main"

      - name: 执行数据库迁移
        run: |
          ssh vm "cd /home/student/vicoo && docker-compose run --rm backend python -m alembic upgrade head || echo '迁移完成或无需迁移'"

      - name: 启动服务
        run: |
          ssh vm "cd /home/student/vicoo && \
            docker-compose pull && \
            docker-compose build && \
            docker-compose down && \
            docker-compose up -d"

      - name: 等待服务启动
        run: sleep 30

      - name: 健康检查
        run: |
          echo "检查Backend健康状态..."
          ssh vm "curl -sf http://localhost:8000/health || echo 'Backend健康检查失败'"
          echo "检查Frontend健康状态..."
          ssh vm "curl -sf http://localhost:80 || echo 'Frontend健康检查失败'"
          echo "检查Admin健康状态..."
          ssh vm "curl -sf http://localhost:8080 || echo 'Admin健康检查失败'"

      - name: 显示服务日志
        if: failure()
        run: |
          ssh vm "cd /home/student/vicoo && docker-compose logs --tail=50"

  # ==================== 部署到Production ====================
  deploy-production:
    name: 部署到Production环境
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://vicoo.example.com
    steps:
      - uses: actions/checkout@v4

      - name: 等待手动确认
        run: |
          echo "=========================================="
          echo "准备部署到Production环境"
          echo "Git SHA: ${{ github.sha }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"
          echo "=========================================="
          echo "请在GitHub Actions界面确认部署"

      - name: 配置SSH客户端
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: 添加生产服务器SSH密钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat << 'EOF' > ~/.ssh/config
          Host jump
              HostName ipa-rdp.ucd.ie
              User CS23219620
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host vm
              HostName csi420-02-vm8.ucd.ie
              User student
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyJump jump
          EOF
          chmod 600 ~/.ssh/config

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 执行生产部署
        run: |
          echo "开始Production部署..."
          ssh vm "cd /home/student/vicoo && \
            git fetch origin && \
            git checkout main && \
            git pull origin main && \
            docker-compose pull && \
            docker-compose build && \
            docker-compose down && \
            docker-compose up -d"

      - name: 生产环境健康检查
        run: |
          sleep 30
          ssh vm "curl -sf http://localhost:8000/health"
          echo "Production部署完成!"

  # ==================== 开发分支快速部署 ====================
  deploy-develop:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: develop
      url: https://dev.vicoo.example.com
    steps:
      - uses: actions/checkout@v4

      - name: 配置SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat << 'EOF' > ~/.ssh/config
          Host jump
              HostName ipa-rdp.ucd.ie
              User CS23219620
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host vm
              HostName csi420-02-vm8.ucd.ie
              User student
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyJump jump
          EOF
          chmod 600 ~/.ssh/config

      - name: 部署到开发服务器
        run: |
          ssh vm "cd /home/student/vicoo && git fetch origin && git checkout develop && git pull origin develop && docker-compose up -d --build"
          echo "开发环境部署完成!"

  # ==================== 构建通知 ====================
  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: 构建状态通知
        if: needs.deploy-staging.result == 'success'
        run: echo "✅ Staging部署成功"

      - name: 部署失败通知
        if: needs.deploy-staging.result == 'failure'
        run: echo "❌ Staging部署失败，请检查日志"