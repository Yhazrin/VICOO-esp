# ============================================
# VICOO — System nginx site (on the VPS host)
# Install: sudo cp this file to /etc/nginx/sites-available/vicoo
#          sudo ln -sf /etc/nginx/sites-available/vicoo /etc/nginx/sites-enabled/
# TLS:     sudo certbot --nginx -d vicoo.yhazrin.xyz
# Upstream: Docker frontend from docker-compose.host-nginx.yml → 127.0.0.1:9080
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name vicoo.yhazrin.xyz;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
