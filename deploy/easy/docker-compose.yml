# ============================================
# VICOO — Easy Deploy Docker Compose
# One-command local deployment: docker compose up -d
# ============================================

services:
  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: vicoo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=200
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - vicoo-net

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    container_name: vicoo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vicoo-net

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ../../
      dockerfile: deploy/easy/backend.dockerfile
    container_name: vicoo-backend
    working_dir: /app/backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      MOCK_USER_PASSWORD: ${MOCK_USER_PASSWORD}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_PAY_API_KEY: ${WECHAT_PAY_API_KEY}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_MODEL: ${OPENAI_MODEL}
      # For entrypoint.sh -- MySQL connection
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Docker 内默认不要用 watchfiles 热重载（双进程 + 长 seed 易导致首次 unhealthy）
      UVICORN_RELOAD: "0"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      # 首次空库时 seed 在 entrypoint 完成；仍保留较长宽限以防慢磁盘
      start_period: 120s
    networks:
      - vicoo-net
    volumes:
      - ./data:/data
      # Mount source code for hot reload (development only)
      - ../../backend:/app/backend

  # ---- Frontend (React + Nginx) ----
  frontend:
    build:
      context: ../..
      dockerfile: deploy/easy/frontend.dockerfile
    container_name: vicoo-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/v1
    #   CHOKIDAR_USEPOLLING: "true"  # Enable file watching in container
    ports:
      - "80:80"
      # - "5173:5173"  # Vite dev server port
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vicoo-net
    # volumes:
    #   # Mount source code for hot reload
    #   - ../../frontend/web-react:/app
    #   - /app/node_modules  # Preserve node_modules

  # 管理后台已并入 frontend 镜像（静态资源 /usr/share/nginx/html/admin/），
  # 不再单独起 admin 容器；独立构建见 deploy/easy/admin.dockerfile

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vicoo-net:
    driver: bridge
    name: vicoo-network
